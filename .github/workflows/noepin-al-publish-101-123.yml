name: NOEPIN AL publish verified 101-123

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Stage NOEPIN AL 101-123 publication')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main origin/main

      - name: Reassemble and verify publication bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .noepin-transfer-101-123/part_*.txt > /tmp/noepin_101_123.b64
          base64 -d /tmp/noepin_101_123.b64 > /tmp/noepin_101_123.tar.xz
          echo "7a42f714fa459f459adb5e4ebb7c35276c9bb2d08873ad2e71f8a3f489382db4  /tmp/noepin_101_123.tar.xz" | sha256sum -c -
          tar -xJf /tmp/noepin_101_123.tar.xz -C .
          python _patch_indexes.py

      - name: Validate publication shape
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json
          root=Path('.')
          mf=json.loads(Path('_publication_manifest.json').read_text(encoding='utf-8'))
          assert len(mf)==23
          for m in mf:
              d=root/m['folder']
              assert (d/'README.md').is_file(), d
              assert (d/'verified_artifact').is_dir(), d
              py=list((d/'verified_artifact').rglob('*.py'))
              assert len(py)==6, (d,len(py))
              assert len(list(d.glob('NOEPIN_AL_*_FINAL_VERIFICATION_REPORT_*.md')))==1, d
              assert len(list(d.glob('NOEPIN_AL_*_FINAL_ARTIFACT_SEAL_*.json')))==1, d
              assert len(list(d.glob('NOEPIN_AL_*_SOURCE_INDEX.txt')))==1, d
              assert (root/'works'/f"{m['n']:03d}-{m['slug']}.md").is_file(), m['n']
          assert not list(root.glob('1??-*/**/__pycache__'))
          assert not list(root.glob('1??-*/**/*.pyc'))
          rt=Path('README.md').read_text(encoding='utf-8')
          wt=Path('works/README.md').read_text(encoding='utf-8')
          assert '> 公開進捗: **123 / 188**' in rt
          assert '**Formal completion / publication progress: 123 / 188**' in rt
          assert '**Published works: 123 / 188**' in wt
          for n in range(101,124):
              assert re.search(rf'^\| {n:03d} \|',rt,re.M), n
              assert re.search(rf'^\| {n:03d} \|',wt,re.M), n
          PY

      - name: Commit final publication and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .noepin-transfer-101-123
          rm -f .github/workflows/noepin-al-publish-101-123.yml
          rm -f _patch_indexes.py _publication_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified NOEPIN AL 101-123"
          git push origin HEAD:main