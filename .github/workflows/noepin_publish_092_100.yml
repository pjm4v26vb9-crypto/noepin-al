name: Publish verified NOEPIN AL 092-100

on:
  push:
    paths:
      - "_transfer/noepin_092_100.part*"
      - ".github/workflows/noepin_publish_092_100.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify publication bundle
        shell: bash
        run: |
          set -euo pipefail
          cat _transfer/noepin_092_100.part* > /tmp/noepin_092_100.b64
          test "$(wc -c < /tmp/noepin_092_100.b64)" -eq 76060
          base64 -d /tmp/noepin_092_100.b64 > /tmp/noepin_092_100.tar.xz
          echo "560302cdcc8858a7fd0f933882259d918e5337328a4974d427f629e9068ede5a  /tmp/noepin_092_100.tar.xz" | sha256sum -c -
          tar -xJf /tmp/noepin_092_100.tar.xz -C .
          test "$(find 092-* 093-* 094-* 095-* 096-* 097-* 098-* 099-* 100-* works -type f \
            \( -path '*/verified_artifact/*' -o -path '092-*/*' -o -path '093-*/*' -o -path '094-*/*' -o -path '095-*/*' -o -path '096-*/*' -o -path '097-*/*' -o -path '098-*/*' -o -path '099-*/*' -o -path '100-*/*' -o -path 'works/09[2-9]-*' -o -path 'works/100-*' \) | wc -l)" -ge 99
          if find 092-* 093-* 094-* 095-* 096-* 097-* 098-* 099-* 100-* -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) | grep -q .; then
            echo "Generated Python cache files found; aborting."
            exit 1
          fi
          rm -rf _transfer

      - name: Commit verified source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish verified source and evidence for NOEPIN AL 092 through 100"
          git push
