name: Publish verified NOEPIN AL 092-100

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.head_ref, 'noepin-publish-092-100-trigger')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main origin/main

      - name: Reassemble and verify publication bundle
        shell: bash
        run: |
          set -euo pipefail
          cat _transfer/noepin_092_100.part* > /tmp/noepin_092_100.b64
          test "$(wc -c < /tmp/noepin_092_100.b64)" -eq 76060
          base64 -d /tmp/noepin_092_100.b64 > /tmp/noepin_092_100.tar.xz
          echo "560302cdcc8858a7fd0f933882259d918e5337328a4974d427f629e9068ede5a  /tmp/noepin_092_100.tar.xz" | sha256sum -c -
          tar -xJf /tmp/noepin_092_100.tar.xz -C .
          test "$(find 092-* 093-* 094-* 095-* 096-* 097-* 098-* 099-* 100-* -type f | wc -l)" -eq 90
          test "$(find works -maxdepth 1 -type f \( -name '09[2-9]-*.md' -o -name '100-*.md' \) | wc -l)" -eq 9
          if find 092-* 093-* 094-* 095-* 096-* 097-* 098-* 099-* 100-* -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) | grep -q .; then
            echo "Generated Python cache files found; aborting."
            exit 1
          fi
          rm -rf _transfer

      - name: Commit verified source and evidence to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified source and evidence for NOEPIN AL 092 through 100"
          git push origin HEAD:main
