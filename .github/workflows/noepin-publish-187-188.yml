name: NOEPIN Publish 187-188

on:
  push:
    branches: [main]
    paths:
      - '.noepin-transfer/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish NOEPIN AL 187-188
        shell: bash
        run: |
          set -euo pipefail
          cat .noepin-transfer/chunk_* > /tmp/noepin_payload.b64
          base64 --decode /tmp/noepin_payload.b64 > /tmp/noepin_payload.tar.xz
          echo "ac5208872c2687d41207614947213ee2739a7366aed0088307f0944cdc9f9092  /tmp/noepin_payload.tar.xz" | sha256sum -c -
          tar -xJf /tmp/noepin_payload.tar.xz -C .
          python - <<'PY'
          from pathlib import Path

          root=Path('README.md')
          s=root.read_text(encoding='utf-8')
          s=s.replace('公開進捗: **186 / 188**','公開進捗: **188 / 188**')
          s=s.replace('**Formal completion: 188 / 188 · GitHub publication progress: 186 / 188**','**Formal completion: 188 / 188 · GitHub publication progress: 188 / 188**')
          marker='| 186 | [AL Distributed Common State Reconstruction V1 / 分散共通State再構成](works/186-distributed-common-state-reconstruction-v1.md) | COMPLETE / VERIFIED |'
          rows=[
            '| 187 | [AUX-00 AL Security Gateway / 共通Security Gateway補助基盤](works/187-security-gateway.md) | COMPLETE / VERIFIED |',
            '| 188 | [NOEPIN AL Safety Suite V1 / 統合Safety Suite補助基盤](works/188-safety-suite-v1.md) | COMPLETE / VERIFIED |',
          ]
          if rows[0] not in s:
              if marker not in s: raise SystemExit('root marker missing')
              s=s.replace(marker,marker+'\n'+'\n'.join(rows))
          root.write_text(s,encoding='utf-8')

          works=Path('works/README.md')
          s=works.read_text(encoding='utf-8')
          s=s.replace('**Published works: 186 / 188**','**Published works: 188 / 188**')
          marker='| 186 | [分散共通State再構成 / AL Distributed Common State Reconstruction V1](186-distributed-common-state-reconstruction-v1.md) | COMPLETE / VERIFIED |'
          rows=[
            '| 187 | [共通Security Gateway補助基盤 / AUX-00 AL Security Gateway](187-security-gateway.md) | COMPLETE / VERIFIED |',
            '| 188 | [統合Safety Suite補助基盤 / NOEPIN AL Safety Suite V1](188-safety-suite-v1.md) | COMPLETE / VERIFIED |',
          ]
          if rows[0] not in s:
              if marker not in s: raise SystemExit('works marker missing')
              s=s.replace(marker,marker+'\n'+'\n'.join(rows))
          works.write_text(s,encoding='utf-8')
          PY
          rm -rf .noepin-transfer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified NOEPIN AL 187-188"
          git push